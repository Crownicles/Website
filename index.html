<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crownicles — A Discord Adventure</title>
  <meta name="description" content="Join the Crownicles adventure on Discord! Explore a medieval world, battle monsters, complete quests, and become the kingdom's greatest hero.">
  <meta name="theme-color" content="#23272a">

  <!-- Open Graph -->
  <meta property="og:title" content="Crownicles — A Discord Adventure">
  <meta property="og:description" content="A multiplayer text-adventure RPG on Discord. Explore, fight, trade and rise to glory.">
  <meta property="og:image" content="./public/images/banner.webp">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://crownicles.com">

  <!-- Favicon -->
  <link rel="icon" href="./public/images/favicon.ico">

  <!-- Google Fonts – Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./public/css/style.css">
</head>
<body>
  <!-- ========== HERO ========== -->
  <section class="hero">
    <div class="hero__inner">
      <div class="hero__text">
        <img src="./public/images/banner.webp" alt="Crownicles logo" class="hero__logo">
        <h1 class="hero__title" data-i18n="hero.title">Crownicles</h1>
        <p class="hero__subtitle" data-i18n="hero.subtitle">A Discord Adventure</p>
        <div class="hero__actions">
          <button class="btn btn--primary" id="btn-get-started" data-i18n="hero.getStarted">Get Started</button>
          <button class="btn btn--ghost" id="btn-learn-more" data-i18n="hero.learnMore">Learn More</button>
        </div>
      </div>
      <div class="hero__visual">
        <img src="./public/images/background.webp" alt="Crownicles throne room" class="hero__illustration">
      </div>
    </div>

    <!-- Language toggle -->
    <button class="lang-toggle" id="lang-toggle" aria-label="Switch language">EN</button>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="footer" id="footer-text"></footer>

  <!-- ========== SCRIPTS ========== -->
  <script type="module" src="./public/js/app.js"></script>
</body>
</html>
